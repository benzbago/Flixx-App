<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Search TMDB movie and TV titles safely with Flixx."
    />
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="lib/fontawesome.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/spinner.css" />
    <script type="module" src="js/app.js"></script>
    <title>Flixx | Search Movies & Shows</title>
  </head>
  <body>
    <header class="main-header">
      <div class="container">
        <div class="logo"><a href="/">FLIXX</a></div>
        <nav>
          <ul>
            <li>
              <a class="nav-link" href="/">Movies</a>
            </li>
            <li>
              <a class="nav-link" href="/shows.html">TV Shows</a>
            </li>
            <li><a class="nav-link" href="/watchlist.html">Watchlist</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <main>
      <!-- Search Movies -->
      <section class="search">
        <div class="container">
          <div id="alert"></div>
          <form action="/search.html" class="search-form">
            <div class="search-radio">
              <input
                type="radio"
                id="movie"
                name="type"
                value="movie"
                checked
              />
              <label for="movie">Movies</label>
              <input type="radio" id="tv" name="type" value="tv" />
              <label for="tv">TV Shows</label>
            </div>
            <div class="search-flex">
              <label class="sr-only" for="search-term"
                >Search movies or TV shows</label
              >
              <input
                type="text"
                name="search-term"
                id="search-term"
                placeholder="Enter search term"
              />
              <button class="btn" type="submit" aria-label="Search">
                <i class="fas fa-search"></i>
              </button>
            </div>
          </form>
        </div>
      </section>

      <!-- Search Results -->
      <section id="search-results-wrapper" class="container">
        <h1 id="search-results-heading" class="page-title"></h1>

        <div id="search-results" class="grid"></div>

        <div id="pagination"></div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="main-footer">
      <div class="container">
        <div class="logo"><span>FLIXX</span></div>
        <a href="/credits.html">Credits</a>
      </div>
    </footer>

    <div class="spinner" hidden aria-hidden="true" aria-label="Loading"></div>
  </body>
</html>
