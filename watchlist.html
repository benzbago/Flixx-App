<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Manage your private browser-local Flixx movie and TV watchlist."
    />
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="lib/fontawesome.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/spinner.css" />
    <script type="module" src="js/app.js"></script>
    <title>Flixx | My Watchlist</title>
  </head>
  <body>
    <header class="main-header">
      <div class="container">
        <div class="logo"><a href="/">FLIXX</a></div>
        <nav aria-label="Main navigation">
          <ul>
            <li><a class="nav-link" href="/">Movies</a></li>
            <li><a class="nav-link" href="/shows.html">TV Shows</a></li>
            <li><a class="nav-link" href="/watchlist.html">Watchlist</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <main class="container page-content">
      <h1 class="page-title">My Watchlist</h1>
      <p class="watchlist-note">
        Saved titles stay in this browser and do not sync between devices.
      </p>
      <div class="watchlist-filters" aria-label="Watchlist filters">
        <label for="watchlist-type-filter">Media type</label>
        <select id="watchlist-type-filter">
          <option value="all">All types</option>
          <option value="movie">Movies</option>
          <option value="tv">TV shows</option>
        </select>
        <label for="watchlist-status-filter">Watch status</label>
        <select id="watchlist-status-filter">
          <option value="all">All statuses</option>
          <option value="want">Want to watch</option>
          <option value="watched">Watched</option>
        </select>
      </div>
      <div
        id="watchlist-feedback"
        class="sr-only"
        role="status"
        aria-live="polite"
      ></div>
      <div id="watchlist" class="grid"></div>
    </main>
    <footer class="main-footer">
      <div class="container">
        <div class="logo"><span>FLIXX</span></div>
        <a href="/credits.html">Credits</a>
      </div>
    </footer>
    <div class="spinner" hidden aria-hidden="true" aria-label="Loading"></div>
  </body>
</html>
